<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor de Carreiras com IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚀 Meu Futuro Profissional</h1>
        <p>Descubra profissões que combinam com você!</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>🤖 Mentor de Carreiras</h2>
            <p>
                Responda às perguntas abaixo e descubra
                quais profissões combinam com seu perfil.
            </p>

            <form id="careerForm">

                <label>1. Qual área mais desperta seu interesse?</label>
                <select id="interesse" required>
                    <option value="">Escolha uma opção</option>
                    <option value="tecnologia">Tecnologia</option>
                    <option value="saude">Saúde</option>
                    <option value="educacao">Educação</option>
                    <option value="criatividade">Arte e criatividade</option>
                    <option value="negocios">Negócios</option>
                </select>

                <label>2. Qual é sua principal habilidade?</label>
                <select id="habilidade" required>
                    <option value="">Escolha uma opção</option>
                    <option value="logica">Raciocínio lógico</option>
                    <option value="comunicacao">Comunicação</option>
                    <option value="criatividade">Criatividade</option>
                    <option value="empatia">Empatia</option>
                    <option value="organizacao">Organização</option>
                </select>

                <label>3. Como prefere trabalhar?</label>
                <select id="trabalho" required>
                    <option value="">Escolha uma opção</option>
                    <option value="equipe">Em equipe</option>
                    <option value="sozinho">Individualmente</option>
                    <option value="ambos">Das duas formas</option>
                </select>

                <label>4. O que você mais valoriza em uma profissão?</label>
                <select id="objetivo" required>
                    <option value="">Escolha uma opção</option>
                    <option value="estabilidade">Estabilidade financeira</option>
                    <option value="ajudar">Ajudar pessoas</option>
                    <option value="inovacao">Inovação e desafios</option>
                    <option value="liberdade">Liberdade e criatividade</option>
                </select>

                <button type="submit">Descobrir minha carreira ✨</button>

            </form>

            <div id="resultado"></div>
        </section>
    </main>

    <footer>
        <p>Projeto educacional desenvolvido com apoio da Inteligência Artificial.</p>
        <p>Mentor de Carreiras © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
